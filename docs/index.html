<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Environmental Instruments Database</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --accent: #2563eb;
    --accent-light: #dbeafe;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --loc-header: #1e40af;
    --tag-nox: #fef9c3; --tag-nox-t: #854d0e;
    --tag-co:  #dcfce7; --tag-co-t:  #166534;
    --tag-so2: #fce7f3; --tag-so2-t: #9d174d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }

  #login-gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg);
  }
  #login-gate h2 { font-size: 1.3rem; margin-bottom: .5rem; color: var(--text); }
  #login-gate p  { color: var(--muted); margin-bottom: 1.5rem; }
  #login-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: .7rem 2rem;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  #login-btn:hover { opacity: .9; }

  #app { display: none; }

  header {
    background: var(--accent);
    color: white;
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  header p  { font-size: .9rem; opacity: .8; margin-top: .25rem; }
  #logout-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.4);
    padding: .4rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
    white-space: nowrap;
  }
  #logout-btn:hover { background: rgba(255,255,255,0.3); }

  .toolbar {
    padding: 1rem 2rem;
    display: flex;
    gap: .75rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar input {
    flex: 1;
    min-width: 200px;
    padding: .5rem .9rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .95rem;
    background: white;
    outline: none;
  }
  .toolbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .count { font-size: .85rem; color: var(--muted); white-space: nowrap; }

  /* ── location blocks ── */
  .locations { padding: 0 2rem 2rem; display: flex; flex-direction: column; gap: 1.5rem; }

  .loc-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  .loc-header {
    background: var(--loc-header);
    color: white;
    padding: .9rem 1.2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .loc-header h2 { font-size: 1.1rem; font-weight: 700; }
  .loc-header .loc-notes { font-size: .8rem; opacity: .8; margin-top: .15rem; }
  .loc-header .chevron { transition: transform .2s; font-size: 1rem; }
  .loc-block.collapsed .chevron { transform: rotate(-90deg); }
  .loc-block.collapsed .loc-body { display: none; }

  .loc-body { padding: .75rem 1rem; display: flex; flex-direction: column; gap: .75rem; }

  /* ── station cards inside a location ── */
  .station-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .station-header {
    background: var(--accent-light);
    color: var(--loc-header);
    padding: .65rem 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    font-weight: 700;
    font-size: .95rem;
  }
  .station-header .chevron { transition: transform .2s; font-size: .9rem; }
  .station-card.collapsed .chevron { transform: rotate(-90deg); }
  .station-card.collapsed .instruments { display: none; }

  .instruments { padding: .25rem 0; }

  .inst-row {
    padding: .6rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .inst-row:last-child { border-bottom: none; }

  .inst-top { display: flex; align-items: center; gap: .5rem; margin-bottom: .4rem; }
  .tag {
    font-size: .72rem;
    font-weight: 700;
    padding: .15rem .45rem;
    border-radius: 999px;
  }
  .tag-NOx { background: var(--tag-nox); color: var(--tag-nox-t); }
  .tag-CO  { background: var(--tag-co);  color: var(--tag-co-t);  }
  .tag-SO2 { background: var(--tag-so2); color: var(--tag-so2-t); }

  .inst-model { font-weight: 600; font-size: .92rem; }
  .inst-sn    { font-size: .8rem; color: var(--muted); margin-left: auto; }

  .inst-detail {
    font-size: .82rem;
    line-height: 1.9;
  }
  .inst-detail table { border-collapse: collapse; width: 100%; }
  .inst-detail td { padding: .1rem .4rem; }
  .inst-detail td:first-child { color: var(--muted); width: 120px; }
  .inst-detail td:last-child  { color: var(--text); font-weight: 500; }

  .no-instruments { padding: .6rem 1rem; font-size: .85rem; color: #94a3b8; }
  .empty { padding: 3rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div id="login-gate">
  <h2>Environmental Instruments Database</h2>
  <p>Sign in to access the instrument inventory</p>
  <button id="login-btn" onclick="netlifyIdentity.open()">Sign in</button>
</div>

<div id="app">
<header>
  <div>
    <h1>Environmental Instruments Database</h1>
    <p>Monitoring stations and instrument inventory</p>
  </div>
  <button id="logout-btn" onclick="netlifyIdentity.logout()">Sign out</button>
</header>

<div class="toolbar">
  <input id="search" placeholder="Search location, station, model, serial number…" oninput="render()">
  <span class="count" id="count"></span>
</div>

<div class="locations" id="locations"></div>
</div>

<script>
netlifyIdentity.on("init", user => { if (user) showApp(); });
netlifyIdentity.on("login", () => { netlifyIdentity.close(); showApp(); });
netlifyIdentity.on("logout", () => {
  document.getElementById("app").style.display = "none";
  document.getElementById("login-gate").style.display = "flex";
});

function showApp() {
  document.getElementById("login-gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  loadData();
}

let data = [];

function loadData() {
  fetch("data.json")
    .then(r => r.json())
    .then(d => { data = d; render(); });
}

function groupByLocation(stations) {
  const map = {};
  for (const s of stations) {
    const loc = s.location || "(no location)";
    if (!map[loc]) map[loc] = [];
    map[loc].push(s);
  }
  return map;
}

function render() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const container = document.getElementById("locations");

  const filtered = data.filter(s => {
    if (!q) return true;
    const hay = [s.station, s.location, s.notes,
      ...s.instruments.flatMap(i => [i.model, i.pollutant, i.serial_number,
        i.part1, i.part2, i.part3, i.part4, i.notes])
    ].join(" ").toLowerCase();
    return hay.includes(q);
  });

  const grouped = groupByLocation(filtered);
  const locNames = Object.keys(grouped).sort();

  document.getElementById("count").textContent =
    `${locNames.length} location${locNames.length !== 1 ? "s" : ""}, ${filtered.length} station${filtered.length !== 1 ? "s" : ""}`;

  if (!filtered.length) {
    container.innerHTML = '<p class="empty">No results found.</p>';
    return;
  }

  container.innerHTML = locNames.map(loc => {
    const stations = grouped[loc];
    return `
      <div class="loc-block" id="loc-${esc(loc)}">
        <div class="loc-header" onclick="toggleLoc('${esc(loc)}')">
          <div>
            <h2>${esc(loc)}</h2>
          </div>
          <span class="chevron">▾</span>
        </div>
        <div class="loc-body">
          ${stations.map(s => stationCard(loc, s)).join("")}
        </div>
      </div>`;
  }).join("");
}

function stationCard(loc, s) {
  const instruments = s.instruments.length
    ? s.instruments.map((i, idx) => instRow(s.station, idx, i)).join("")
    : '<div class="no-instruments">No instruments assigned</div>';

  return `
    <div class="station-card" id="s-${esc(s.station)}">
      <div class="station-header" onclick="toggleStation('${esc(s.station)}')">
        <span>${esc(s.station)}</span>
        <span class="chevron">▾</span>
      </div>
      <div class="instruments">${instruments}</div>
    </div>`;
}

function instRow(station, idx, i) {
  const parts = [i.part1, i.part2, i.part3, i.part4].filter(Boolean);
  const rows = [
    ["Serial No.",  i.serial_number],
    ["Installed",   i.installed_date],
    ["Cal. high",   i.cal_high_date],
    ["Cal. low",    i.cal_low_date],
    parts.length ? ["Parts", parts.join(", ")] : null,
    ["Notes",       i.notes],
  ].filter(r => r && r[1]);

  const detail = rows.map(([l, v]) => `<tr><td>${l}</td><td>${esc(v)}</td></tr>`).join("");

  return `
    <div class="inst-row" id="i-${esc(station)}-${idx}">
      <div class="inst-top">
        <span class="tag tag-${esc(i.pollutant)}">${esc(i.pollutant)}</span>
        <span class="inst-model">${esc(i.model)}</span>
      </div>
      <div class="inst-detail"><table>${detail}</table></div>
    </div>`;
}

function toggleLoc(name) {
  document.getElementById("loc-" + name).classList.toggle("collapsed");
}
function toggleStation(name) {
  document.getElementById("s-" + name).classList.toggle("collapsed");
}

function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
